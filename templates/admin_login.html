{% extends 'layout.html' %}{% from '_forms.html' import csrf, input %}
{% block content %}<section class="card auth-card">
<h1 class="section-title">운영진 로그인</h1>
<form method="post">{{ csrf() }}
{{ input('username', '관리자 아이디', maxlen=50, autocomplete='username') }}
{{ input('password', '비밀번호', 'password', maxlen=128, autocomplete='current-password') }}
<button class="btn btn-primary full-width">로그인</button>
</form></section>{% endblock %}
